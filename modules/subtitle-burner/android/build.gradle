plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'es.scriptcue'
version = '1.0.0'

android {
  namespace "expo.modules.subtitleburner"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Misma versión de Media3 que ya trae la cámara (CameraX usa media3-common/muxer 1.9.0).
  implementation "androidx.media3:media3-transformer:1.9.0"
  implementation "androidx.media3:media3-effect:1.9.0"
  implementation "androidx.media3:media3-common:1.9.0"
}
